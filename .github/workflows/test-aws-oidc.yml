
name: Test EKS OPA Gatekeeper

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-eks-access:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012793737645:role/GitHubActions-EKS-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsEKS

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Verify EKS cluster
      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name sandbox-demo \
            --region ap-south-1 \
            --query "cluster.{Name:name,Status:status}" \
            --output table

      # 5. Configure Kubernetes access
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name sandbox-demo \
            --region ap-south-1

      # 6. Verify Kubernetes authorization
      - name: Verify Kubernetes permissions
        run: |
          kubectl auth can-i create deployments -n opa-lab
          kubectl auth can-i create pods -n opa-lab
          kubectl get deployments -n opa-lab

      # 7. Deploy intentionally noncompliant application
      - name: Deploy noncompliant application
        run: |
          kubectl apply \
            -f applications/noncompliant-app.yaml

      # 8. Wait for admission and controller events
      - name: Wait for Gatekeeper evaluation
        run: |
          sleep 15

      # 9. Inspect deployment status and events
      - name: Verify Gatekeeper rejection
        run: |
          echo "Deployment status:"
          kubectl get deployment nginx-noncompliant \
            -n opa-lab

          echo "Deployment events:"
          kubectl describe deployment nginx-noncompliant \
            -n opa-lab

          echo "Pod status:"
          kubectl get pods -n opa-lab

          echo "Checking Gatekeeper denial events..."

          EVENTS=$(kubectl get events \
            -n opa-lab \
            --field-selector reason=FailedCreate \
            -o jsonpath='{range .items[*]}{.message}{"\n"}{end}')

          echo "$EVENTS"

          if echo "$EVENTS" | grep -qi \
            'admission webhook.*gatekeeper'; then
            echo "SUCCESS: Gatekeeper rejected Pod creation."
          else
            echo "FAILED: No Gatekeeper rejection found."
            exit 1
          fi
