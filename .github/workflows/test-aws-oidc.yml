
name: Test GitHub Actions EKS Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-eks-access:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012793737645:role/GitHubActions-EKS-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsEKS

      # Step 3: Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # Step 4: Verify EKS cluster
      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name sandbox-demo \
            --region ap-south-1 \
            --query "cluster.{Name:name,Status:status}" \
            --output table

      # Step 5: Configure Kubernetes access
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name sandbox-demo \
            --region ap-south-1

      # Step 6: Verify namespace access
      - name: Verify Kubernetes permissions
        run: |
          echo "Checking deployment creation permission..."

          kubectl auth can-i create deployments \
            --namespace opa-lab

          echo "Checking Pod creation permission..."

          kubectl auth can-i create pods \
            --namespace opa-lab

          echo "Checking existing deployments..."

          kubectl get deployments \
            --namespace opa-lab

      # Step 7: Verify Gatekeeper policy resources
      - name: Verify Gatekeeper policies
        run: |
          echo "Checking Gatekeeper admission..."

          kubectl auth can-i create pods \
            --namespace opa-lab

          echo "Gatekeeper admission enforcement will be tested during deployment."
