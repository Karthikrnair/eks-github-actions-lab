
name: Test GitHub Actions EKS Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-eks-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012793737645:role/GitHubActions-EKS-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsEKS

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --name sandbox-demo \
            --region ap-south-1 \
            --query "cluster.{Name:name,Status:status}" \
            --output table

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name sandbox-demo \
            --region ap-south-1

      - name: Verify Kubernetes permissions
        run: |
          echo "Checking deployment permission..."
          kubectl auth can-i create deployments -n opa-lab

          echo "Checking Pod permission..."
          kubectl auth can-i create pods -n opa-lab

          echo "Checking deployments..."
          kubectl get deployments -n opa-lab

      - name: Test OPA Gatekeeper admission
        run: |
          echo "Testing noncompliant deployment..."

          kubectl apply \
            -f applications/noncompliant-app.yaml

          echo "Checking deployment and Pod status..."
          kubectl get deployments,pods -n opa-lab

          echo "Checking deployment events..."
          kubectl describe deployment \
            nginx-noncompliant -n opa-lab
