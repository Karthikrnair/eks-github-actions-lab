
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-noncompliant
  namespace: opa-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-noncompliant
  template:
    metadata:
      labels:
        app: nginx-noncompliant
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
